{% set title = "登录 / 注册" %}
{% extends "base.html" %}
{% block content %}
<section class="card narrow">
  <h1>登录 / 注册</h1>
  <div id="auth-off" class="notice" hidden>论坛账号系统还没有配置好（站长需要先设置 Supabase），暂时只能浏览。</div>
  <div id="auth-box">
    <button class="btn btn-github" id="github-login" type="button">
      <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      用 GitHub 登录
    </button>
    <div class="divider"><span>或用邮箱</span></div>
    <div class="tabs" role="tablist">
      <button type="button" class="tab on" data-tab="signin" role="tab">登录</button>
      <button type="button" class="tab" data-tab="signup" role="tab">注册</button>
    </div>
    <form id="email-form" class="form">
      <label class="only-signup" hidden>昵称<input name="nickname" maxlength="20" autocomplete="nickname" placeholder="2-20 个字"></label>
      <label>邮箱<input name="email" type="email" required autocomplete="email"></label>
      <label>密码<input name="password" type="password" required minlength="8" autocomplete="current-password" placeholder="至少 8 位"></label>
      <button class="btn" type="submit" id="email-submit">登录</button>
      <p class="form-msg" id="auth-msg" role="status"></p>
      <p class="muted small"><a href="#" id="forgot">忘记密码？</a></p>
    </form>
  </div>
</section>
{% endblock %}
