# 网站基本信息（SEO 用）
name: "TimelyReach 华人时讯"
short_name: "华人时讯"
tagline: "海外华人每日热点 · 美国新闻中文速递 · 华人论坛闲话"
description: "TimelyReach 华人时讯：每天精选华尔街日报、彭博、纽约邮报、ZeroHedge、推特和各大华人论坛热帖，用通俗中文讲清楚美国新闻、财经股市与华人生活，欢迎注册参与讨论。"
keywords: "海外华人,华人论坛,美国新闻,中文新闻,华尔街日报中文,彭博中文,美股,华人闲话,北美华人"
base_url: "https://www.timelyreach.com"
language: "zh-CN"
# 站长 GitHub 账号：用这个账号通过 GitHub 登录的用户自动成为站长（admin）
admin_github: "ivywa12345"
per_page: 40
# Cloudflare Web Analytics：Pages 项目已开启自动注入（网页里会自带一个统计脚本），
# 再手动加一个会变成两个统计站点。想改用手动脚本时，把 token 填在这里。
analytics_token: ""

# 谷歌分析（Google Analytics 4）。在 analytics.google.com 创建“数据流”后，把衡量 ID 填在这里，留空就不加载。
ga_measurement_id: "G-KTLDSECHMJ"
# 谷歌跳转标签管理器（GTM）。注意：不要在 GTM 容器里再添加同一个 G- 衡量 ID 的 GA4 配置代码，否则每次访问会被统计两次。
gtm_id: "GTM-K256QZK2"

# 谷歌广告（AdSense）。拿到发布商 ID 后填在这里即可，留空就不会加载任何广告代码。
adsense_client: ""        # 例如 "ca-pub-1234567890123456"
# 手动广告位：在 AdSense 后台创建“展示广告”后，把广告单元 ID（一串数字）填进来；留空的位置不显示。
# 只填 adsense_client 不填广告位，则只加载广告脚本，由 AdSense 的“自动广告”决定位置。
ad_slots:
  article_top: ""         # 文章标题和正文之间
  article_bottom: ""      # 文章正文下面、跟帖上面
  sidebar: ""             # 文章页右侧栏
  list: ""                # 版块列表第 5 条后面

# 论坛版块。kind=auto 由机器人自动抓取发帖；kind=user 由读者发帖
boards:
  # ---- 内容区：机器人和站长发帖，读者跟帖 ----
  - id: picks
    name: "站长荐读"
    kind: auto
    description: "站长亲自挑选的好文章，配上站长的点评和解读"
  - id: brief
    name: "每日简报"
    kind: auto
    description: "每个交易日的中文财经早报：一帖看懂隔夜要闻和今天要盯的事；周末加一篇本周回顾"
  - id: finance
    name: "财经要闻"
    kind: auto
    description: "华尔街日报、彭博、ZeroHedge 财经要闻中文速递：美股、利率、宏观、公司动态"
  - id: news
    name: "美国新闻"
    kind: auto
    description: "美国社会、政治与国际要闻，从华尔街日报、纽约邮报、文学城等编译"
  - id: china
    name: "中国观察"
    kind: auto
    description: "联合早报等中文媒体的中国与亚洲要闻，海外华人关心的家乡动态"
  - id: hot
    name: "网络热帖"
    kind: auto
    description: "网上正在被热议的话题，来这里接着聊"
  # ---- 讨论区：读者发帖（可匿名）----
  - id: invest
    name: "美股期权"
    kind: user
    description: "个股、期权、0DTE、SPX/VIX、晒单复盘，交流思路（不构成投资建议）"
  - id: money
    name: "理财规划"
    kind: user
    description: "401k、IRA、Roth、报税、保险、信用卡、银行开户奖励"
  - id: house
    name: "房产"
    kind: user
    description: "买房、贷款、再融资、出租、房产税"
  - id: career
    name: "职场身份"
    kind: user
    description: "找工作、薪资对比、跳槽、H1B、绿卡"
  - id: chat
    name: "华人闲话"
    kind: user
    description: "海外华人的茶馆，家长里短、育儿美食旅游、时事八卦，想聊就聊"
