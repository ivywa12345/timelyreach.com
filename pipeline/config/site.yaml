    name: "站长荐读"
    kind: auto
    description: "站长亲自挑选的好文章，配上站长的点评和解读"
  - id: news
    name: "新闻速递"
    kind: auto
    description: "美国及国际要闻，每天从华尔街日报、纽约邮报、文学城等编译"
  - id: finance
    name: "财经股市"
    kind: auto
    description: "华尔街日报、彭博、ZeroHedge 财经要闻，美股、期权、宏观一网打尽"
  - id: twitter
    name: "推特热议"
    kind: auto
    description: "推特（X）上大佬和财经大V的热门推文中文解读"
