# 内容来源。每个来源可配置多种抓取方式（urls 依次尝试，第一个成功即用）。
#
#   type: rss        -> 标准 RSS/Atom 地址
#   type: rsshub     -> RSSHub 路由（https://github.com/DIYgod/RSSHub），
#                       GitHub Actions 里会自动启动一个 RSSHub 容器（http://localhost:1200）
#   type: links      -> 直接抓网页，用正则匹配帖子链接（适合论坛列表页）
#
#   lang: en  -> 用 AI 编译成中文新闻稿
#   lang: zh  -> 中文来源，只生成导读摘要 + 原帖链接，供读者讨论
#   board     -> 发到哪个版块（见 site.yaml）
#   limit     -> 每次运行最多取几条新内容
#   full_text -> 是否抓取原文正文供 AI 参考（付费墙网站只能拿到摘要）

sources:
  # ---------------- 英文新闻 ----------------
  - id: wsj-world
    name: "华尔街日报"
    lang: en
    board: news
    limit: 4
    full_text: false
    fetch:
      - {type: rss, url: "https://feeds.content.dowjones.io/public/rss/RSSWorldNews"}
      - {type: rss, url: "https://feeds.a.dj.com/rss/RSSWorldNews.xml"}

  - id: wsj-markets
    name: "华尔街日报"
    lang: en
    board: finance
    limit: 4
    full_text: false
    fetch:
      - {type: rss, url: "https://feeds.content.dowjones.io/public/rss/RSSMarketsMain"}
      - {type: rss, url: "https://feeds.a.dj.com/rss/RSSMarketsMain.xml"}

  # WSJ 里比较好玩、适合讨论的：生活方式、科技、观点版（付费墙只拿得到摘要，AI 据摘要编译）
  - id: wsj-lifestyle
    name: "华尔街日报"
    lang: en
    board: hot
    limit: 3
    full_text: false
    fetch:
      - {type: rss, url: "https://feeds.content.dowjones.io/public/rss/RSSLifestyle"}
      - {type: rss, url: "https://feeds.a.dj.com/rss/RSSLifestyle.xml"}

  - id: wsj-tech
    name: "华尔街日报"
    lang: en
    board: finance
    limit: 2
    full_text: false
    fetch:
      - {type: rss, url: "https://feeds.content.dowjones.io/public/rss/RSSWSJD"}
      - {type: rss, url: "https://feeds.a.dj.com/rss/RSSWSJD.xml"}

  - id: wsj-opinion
    name: "华尔街日报"
    lang: en
    board: hot
    limit: 2
    full_text: false
    fetch:
      - {type: rss, url: "https://feeds.content.dowjones.io/public/rss/RSSOpinion"}
      - {type: rss, url: "https://feeds.a.dj.com/rss/RSSOpinion.xml"}

  # 经济学人：分版块 RSS，付费墙同样只有摘要
  - id: economist-finance
    name: "经济学人"
    lang: en
    board: finance
    limit: 3
    full_text: false
    merge: true
    fetch:
      - {type: rss, url: "https://www.economist.com/finance-and-economics/rss.xml"}
      - {type: rss, url: "https://www.economist.com/business/rss.xml"}

  - id: economist-world
    name: "经济学人"
    lang: en
    board: news
    limit: 3
    full_text: false
    merge: true
    fetch:
      - {type: rss, url: "https://www.economist.com/leaders/rss.xml"}
      - {type: rss, url: "https://www.economist.com/united-states/rss.xml"}
      - {type: rss, url: "https://www.economist.com/china/rss.xml"}
      - {type: rss, url: "https://www.economist.com/science-and-technology/rss.xml"}

  - id: bloomberg-markets
    name: "彭博社"
    lang: en
    board: finance
    limit: 4
    full_text: false
    fetch:
      - {type: rss, url: "https://feeds.bloomberg.com/markets/news.rss"}
      - {type: rsshub, route: "/bloomberg/markets"}

  - id: bloomberg-politics
    name: "彭博社"
    lang: en
    board: news
    limit: 2
    full_text: false
    fetch:
      - {type: rss, url: "https://feeds.bloomberg.com/politics/news.rss"}

  - id: zerohedge
    name: "ZeroHedge"
    lang: en
    board: finance
    limit: 4
    full_text: true
    fetch:
      - {type: rss, url: "https://feeds.feedburner.com/zerohedge/feed"}
      - {type: rss, url: "https://cms.zerohedge.com/fullrss2.xml"}

  - id: nypost
    name: "纽约邮报"
    lang: en
    board: news
    limit: 5
    full_text: true
    fetch:
      - {type: rss, url: "https://nypost.com/news/feed/"}
      - {type: rss, url: "https://nypost.com/feed/"}

  # ---------------- 推特 / X ----------------
  # 需要在 GitHub 仓库 Secrets 里设置 TWITTER_AUTH_TOKEN（你自己 X 账号 cookie 里的 auth_token），
  # RSSHub 才能抓推特。没设置时会自动跳过。
  - id: twitter
    name: "推特"
    lang: en
    board: hot
    limit: 6
    full_text: false
    requires_env: TWITTER_AUTH_TOKEN
    fetch:
      - {type: rsshub, route: "/twitter/user/elonmusk"}
      - {type: rsshub, route: "/twitter/user/zerohedge"}
      - {type: rsshub, route: "/twitter/user/KobeissiLetter"}
      - {type: rsshub, route: "/twitter/user/unusual_whales"}
      - {type: rsshub, route: "/twitter/user/realDonaldTrump"}
    merge: true   # 以上全部合并，而不是只取第一个成功的

  # ---------------- 中文财经 ----------------
  # 只抓文学城"财经新闻"频道的主帖（不抓回帖）。文学城是转载站，
  # 每篇都按页面上的"来源"署名真正的出处（华尔街见闻、财联社、第一财经……），不写文学城。
  - id: wenxuecity-finance
    name: "财经媒体"          # 实际署名用每篇的真实来源
    lang: zh-news
    board: finance
    limit: 8
    full_text: true
    fetch:
      - {type: wxc_finance, url: "https://bbs.wenxuecity.com/financenews/"}

  # 一亩三分地、新未名空间、华人网已停用（内容不是财经类）。

  # 小红书没有公开的热榜接口，反爬很严。RSSHub 可以抓指定用户的笔记，
  # 需要设置 XIAOHONGSHU_COOKIE，并把下面的 user_id 换成你想关注的博主。
  - id: xiaohongshu
    name: "小红书"
    lang: zh
    board: hot
    limit: 4
    full_text: false
    enabled: false   # 填好博主 ID 后改成 true
    requires_env: XIAOHONGSHU_COOKIE
    merge: true
    fetch:
      - {type: rsshub, route: "/xiaohongshu/user/REPLACE_WITH_USER_ID/notes"}
