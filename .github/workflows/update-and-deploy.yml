name: 抓取新闻并部署网站

on:
  schedule:
    # 每 4 小时一次（UTC），美东早上 7 点左右有一次
    - cron: "17 3,7,11,15,19,23 * * *"
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["data/**", "**.md"]
  issues:
    # 站长提交"站长荐读"后马上发布
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      max_new:
        description: "本次最多新增几篇"
        required: false
        default: "40"

permissions:
  contents: write
  issues: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    # 别人开的 issue 不触发运行（仓库是公开的）
    if: github.event_name != 'issues' || github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      # 自带一个 RSSHub（https://github.com/DIYgod/RSSHub），用来抓推特、文学城、一亩三分地、小红书
      rsshub:
        image: diygod/rsshub:latest
        ports: ["1200:1200"]
        env:
          NODE_ENV: production
          CACHE_TYPE: memory
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          XIAOHONGSHU_COOKIE: ${{ secrets.XIAOHONGSHU_COOKIE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: 安装依赖
        run: pip install -r pipeline/requirements.txt

      - name: 等待 RSSHub 启动
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:1200/ >/dev/null && echo "RSSHub ready" && exit 0
            sleep 2
          done
          echo "::warning::RSSHub did not start; RSSHub sources will be skipped"

      - name: 抓取并编译新闻（含站长荐读）
        working-directory: pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          XIAOHONGSHU_COOKIE: ${{ secrets.XIAOHONGSHU_COOKIE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RSSHUB_BASE: http://localhost:1200
          TR_MAX_NEW: ${{ github.event.inputs.max_new || '40' }}
        run: |
          [ -n "$CLAUDE_MODEL" ] || unset CLAUDE_MODEL
          python -m timelyreach update

      - name: 保存新内容到仓库
        run: |
          git config user.name "timelyreach-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no new content"
          else
            git commit -m "content: $(date -u +'%Y-%m-%d %H:%M') 自动更新"
            BRANCH="${{ github.event.repository.default_branch }}"
            [ "${{ github.event_name }}" = "push" ] && BRANCH="${GITHUB_REF_NAME}"
            for i in 1 2 3; do
              git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH" && break
              sleep 5
            done
          fi

      - name: 生成网站
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: python -m timelyreach build

      - name: 检查 Cloudflare 设置
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::未设置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，跳过部署（见 README）"
          fi

      - name: 部署到 Cloudflare Pages
        if: steps.cf.outputs.ready == 'true'
        env:
          RAW_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CLOUDFLARE_PROJECT || 'timelyreach' }}
        run: |
          # Secrets pasted from a web page often carry a trailing newline or extra lines;
          # keep the first non-empty line, without spaces, and say if anything was dropped.
          clean() { printf '%s\n' "$1" | tr -d ' \t\r' | grep -v '^$' | head -n1; }
          for name in RAW_CF_TOKEN RAW_CF_ACCOUNT; do
            n=$(printf '%s\n' "${!name}" | grep -cv '^[[:space:]]*$' || true)
            if [ "$n" -gt 1 ]; then echo "::warning::${name#RAW_} secret has $n lines; using the first one. Re-save it as a single line."; fi
          done
          export CLOUDFLARE_API_TOKEN="$(clean "$RAW_CF_TOKEN")"
          export CLOUDFLARE_ACCOUNT_ID="$(clean "$RAW_CF_ACCOUNT")"
          npx --yes wrangler@4.139.0 pages project create "$CF_PROJECT" --production-branch=main 2>/dev/null || true
          npx --yes wrangler@4.139.0 pages deploy _site --project-name="$CF_PROJECT" --branch=main --commit-dirty=true

  test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: pipeline
