name: debug-wenxuecity (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe finance channel
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/128.0 Safari/537.36"
          curl -sL -A "$UA" -o f.html -w "status %{http_code} final %{url_effective}\n" https://bbs.wenxuecity.com/financenews/
          file f.html; grep -o 'charset=[^"]*' f.html | head -2
          echo "=== distinct link shapes ==="
          grep -oE 'href="[^"]+"' f.html | sed -E 's/[0-9]{3,}/N/g' | sort | uniq -c | sort -rn | head -30
          echo "=== sample anchors ==="
          grep -oE '<a [^>]*href="[^"]*[0-9]{5,}[^"]*"[^>]*>[^<]{4,60}</a>' f.html | head -25
          U=$(grep -oE 'href="[^"]*[0-9]{6,}[^"]*"' f.html | head -1 | sed -E 's/href="//; s/"$//')
          case "$U" in //*) U="https:$U";; /*) U="https://bbs.wenxuecity.com$U";; esac
          echo "=== first article: $U ==="
          curl -sL -A "$UA" "$U" -o p.html
          grep -n -iE '来源|postmeta|itemprop|<title>' p.html | head -20
          grep -oE 'class="[^"]*(post|content|article|body)[^"]*"' p.html | sort | uniq -c | head -15
